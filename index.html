<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vivek Kumar | CSE Portfolio</title>
  <meta name="description"
    content="Portfolio of Vivek Kumar, a Full Stack Web Developer and B.Tech CSE Student at LPU." />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            primary: '#06b6d4',   // Cyan 500
            secondary: '#8b5cf6', // Violet 500
            dark: '#020617',      // Near-black
            'dark-2': '#0d1117',  // GitHub-like dark
            'dark-card': '#0f1929',
          },
          animation: {
            'gradient-shift': 'gradientShift 8s ease infinite',
            'float': 'float 6s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
          },
          keyframes: {
            gradientShift: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '1', boxShadow: '0 0 10px rgba(6,182,212,0.5)' },
              '50%': { opacity: '0.7', boxShadow: '0 0 30px rgba(6,182,212,0.8)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% center' },
              '100%': { backgroundPosition: '200% center' },
            },
          },
        },
      },
    }
  </script>
  <!-- Google Fonts: Outfit + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    /* =========================================
         PREMIUM DARK DESIGN SYSTEM
         ========================================= */

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
    }

    ::-webkit-scrollbar-thumb {
      background: #06b6d4;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #8b5cf6;
    }

    /* Gradient text — cyan to violet */
    .gradient-text {
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      background-image: linear-gradient(135deg, #06b6d4, #8b5cf6);
      background-size: 200% auto;
      animation: gradientShift 8s ease infinite;
    }

    /* Glassmorphism card */
    .glass {
      background: rgba(13, 17, 23, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 182, 212, 0.15);
    }

    /* Glowing border on hover */
    .glow-border {
      border: 1px solid rgba(6, 182, 212, 0.2);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .glow-border:hover {
      border-color: rgba(6, 182, 212, 0.6);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.15), inset 0 0 20px rgba(6, 182, 212, 0.03);
    }

    /* Cyan glow glow-border variant for violet */
    .glow-border-violet:hover {
      border-color: rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.15), inset 0 0 20px rgba(139, 92, 246, 0.03);
    }

    /* Glowing top border on cards */
    .card-glow-top {
      position: relative;
    }

    .card-glow-top::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      border-radius: 2px 2px 0 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card-glow-top:hover::before {
      opacity: 1;
    }

    /* Mesh gradient blobs */
    .mesh-bg {
      background-color: #020617;
      background-image:
        radial-gradient(ellipse 80% 50% at 10% 20%, rgba(6, 182, 212, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 90% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
    }

    /* Section divider gradient */
    .section-dark {
      background: #020617;
    }

    .section-dark-alt {
      background: #040d1f;
    }

    /* Glow button effect */
    .btn-glow {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
      transition: box-shadow 0.3s ease, transform 0.2s ease;
    }

    .btn-glow:hover {
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.6);
      transform: translateY(-2px);
    }

    /* Timeline glow line */
    .timeline-line {
      background: linear-gradient(to bottom, #06b6d4, #8b5cf6);
    }

    /* Shimmer animation for button */
    .shimmer-btn {
      background: linear-gradient(90deg, #06b6d4 0%, #8b5cf6 50%, #06b6d4 100%);
      background-size: 200% auto;
      animation: shimmer 2.5s linear infinite;
    }

    /* Tech pill tags */
    .tech-pill {
      font-size: 0.7rem;
      padding: 2px 10px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.1);
      color: #06b6d4;
      border: 1px solid rgba(6, 182, 212, 0.25);
      transition: background 0.2s, border-color 0.2s;
    }

    .tech-pill:hover {
      background: rgba(6, 182, 212, 0.2);
      border-color: rgba(6, 182, 212, 0.5);
    }

    /* Status badge pulsing dot */
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes gradientShift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    /* Blur blobs animated */
    @keyframes blobFloat {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(30px, -20px) scale(1.05);
      }

      66% {
        transform: translate(-20px, 15px) scale(0.95);
      }
    }

    .blob {
      animation: blobFloat 12s ease-in-out infinite;
    }

    .blob-delay {
      animation-delay: 6s;
    }

    /* Terminal card code style */
    .terminal-text {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    /* ── Sci-Fi Background: scrolling grid ── */
    @keyframes gridMove {
      0%   { background-position: 0px 0px; }
      100% { background-position: 0px 60px; }
    }

    /* ── SciFi Background: horizontal scan sweep ── */
    @keyframes scanSweep {
      0%   { top: -2px; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* ── Terminal scanline overlay ── */
    .terminal-scanline {
      position: relative;
      overflow: hidden;
    }
    .terminal-scanline::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: rgba(6,182,212,0.15);
      animation: termScan 3s linear infinite;
      pointer-events: none;
    }
    @keyframes termScan {
      0%   { top: 0%; }
      100% { top: 100%; }
    }

    /* ── Subtle text glow for HUD elements ── */
    .hud-text {
      font-family: 'Courier New', monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ── HUD bracket corners ── */
    .hud-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(6,182,212,0.5);
      border-style: solid;
    }
    .hud-corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; border-radius: 2px 0 0 0; }
    .hud-corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; border-radius: 0 2px 0 0; }
    .hud-corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; border-radius: 0 0 0 2px; }
    .hud-corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; border-radius: 0 0 2px 0; }

    /* ── Terminal line slide-in ── */
    .terminal-text-line {
      animation: lineIn 0.2s ease forwards;
    }
    @keyframes lineIn {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Neon flicker for accent elements ── */
    @keyframes neonFlicker {
      0%, 100% { opacity: 1; }
      92%       { opacity: 1; }
      93%       { opacity: 0.4; }
      94%       { opacity: 1; }
      96%       { opacity: 0.6; }
      97%       { opacity: 1; }
    }
    .neon-flicker {
      animation: neonFlicker 5s ease-in-out infinite;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-[#020617] text-gray-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.jsx"></script>
</body>

</html>
